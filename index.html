<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>DriveSync - Rittenplanner</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --border: #334155;
      --danger: #ef4444;
      --primary: #38bdf8;
      --success: #22c55e;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; max-width: 100vw; overflow-x: hidden; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { width: 100%; max-width: 600px; }
    .form-section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
      margin-bottom: 14px;
      width: 100%;
    }
    .form-section.active-edit { border-color: var(--warning); background-color: #27272a; }
    .section-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    .date-header { font-size: 12px; font-weight: 700; color: var(--text); text-transform: capitalize; }
    .sync-status {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 20px;
      background: #334155;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .sync-status.synced { background: rgba(34, 197, 94, 0.15); color: var(--success); }
    .sync-status.syncing { background: rgba(56, 189, 248, 0.15); color: var(--primary); }
    .sync-status.error { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
    
    label { display: block; font-size: 11px; font-weight: 600; color: #94a3b8; text-align: left; margin-top: 8px; margin-bottom: 3px; }
    input, select {
      width: 100%;
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      background: #0f172a;
      color: var(--text);
      margin-bottom: 4px;
    }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .row-add { display: flex; gap: 6px; margin-bottom: 8px; }
    .row-add input { margin-bottom: 0; flex: 1; }
    .row-add button {
      padding: 0 12px; background: var(--border); border: none; border-radius: 8px;
      font-weight: bold; font-size: 11px; color: var(--text); cursor: pointer; white-space: nowrap;
    }
    .btn-action {
      background: var(--primary); color: #0f172a; border: none; width: 100%;
      padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 800; cursor: pointer; margin-top: 10px;
    }
    .btn-action.editing { background: var(--warning); color: #0f172a; }
    .timer-row { display: flex; gap: 6px; margin-top: 6px; margin-bottom: 8px; }
    .btn-start { background: var(--success); color: #fff; border: none; flex: 1; padding: 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .btn-stop { background: var(--danger); color: #fff; border: none; flex: 1; padding: 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }

    .receipt { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 6px; max-height: 300px; overflow-y: auto; }
    .receipt-item { display: flex; justify-content: space-between; align-items: center; font-size: 11px; padding: 8px; border-bottom: 1px solid var(--border); }
    .receipt-item:last-child { border-bottom: none; }
    .tag { font-size: 9px; background: #334155; padding: 2px 6px; border-radius: 4px; color: var(--text); margin-right: 4px; display: inline-block; margin-top: 2px;}
    .tag-dest { background: rgba(56, 189, 248, 0.2); color: var(--primary); }
    .tag-comp { background: rgba(168, 85, 247, 0.2); color: #d8b4fe; }
    
    .action-btns { display: flex; gap: 4px; align-items: center; }
    .btn-check { background: var(--success); color: white; border: none; border-radius: 4px; padding: 5px 8px; font-size: 10px; cursor: pointer; font-weight: bold; }
    .btn-edit { background: var(--warning); color: #0f172a; border: none; border-radius: 4px; padding: 5px 8px; font-size: 10px; cursor: pointer; font-weight: bold; }
    .item-del-btn { background: var(--danger); color: white; border: none; border-radius: 4px; width: 24px; height: 24px; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    
    <div class="form-section">
      <div class="section-title">
        <div>
          <div style="font-size: 15px; font-weight: 900; color: var(--text);">DriveSync</div>
          <span class="date-header" id="currentDateStr">Laden...</span>
        </div>
        <div class="sync-status synced" id="syncStatusIndicator" onclick="laadVanBin(true)">
          <span id="syncDot">●</span> <span id="syncText">Verbonden</span>
        </div>
      </div>
      
      <div style="font-size: 11px; font-weight: bold; margin-bottom: 6px; color: #94a3b8; display: flex; justify-content: space-between;">
        <span>ACTIEVE RITTEN</span>
        <span id="aantalRittenBadge" style="background: var(--border); padding: 1px 6px; border-radius: 10px; font-size: 10px;">0</span>
      </div>
      
      <div class="receipt" id="receiptList">
        <div style="color: #64748b; text-align: center; font-size: 11px; padding: 15px;">Geen ritten ingepland</div>
      </div>
    </div>

    <div class="form-section" id="inputFormCard">
      <div class="section-title" id="formTitle">Nieuwe Rit Inplannen</div>
      
      <label>AFSPRAAK TIJDSTIP *</label>
      <input type="datetime-local" id="afspraakInput">

      <div class="grid-2">
        <div>
          <label>START TIJD</label>
          <input type="datetime-local" id="startInput">
        </div>
        <div>
          <label>EIND TIJD</label>
          <input type="datetime-local" id="eindInput">
        </div>
      </div>

      <div class="timer-row">
        <button class="btn-start" onclick="setLiveTime('start')">▶ Start Nu</button>
        <button class="btn-stop" onclick="setLiveTime('eind')">⏹ Stop Nu</button>
      </div>

      <label>BESTEMMING</label>
      <select id="bestemmingSelect"></select>
      <div class="row-add">
        <input type="text" id="newBestemmingInput" placeholder="Nieuwe bestemming...">
        <button onclick="addBestemming()">+ Voeg toe</button>
      </div>

      <label>BEDRIJF / VERVOERDER</label>
      <select id="bedrijfSelect"></select>
      <div class="row-add">
        <input type="text" id="newBedrijfInput" placeholder="Nieuw bedrijf...">
        <button onclick="addBedrijf()">+ Voeg toe</button>
      </div>

      <div id="herhalingContainer">
        <label>HERHALING</label>
        <select id="herhalingSelect">
          <option value="geen">Geen herhaling</option>
          <option value="dag">Elke dag</option>
          <option value="omdedag">Om de dag</option>
          <option value="ma-wo-vr">Ma - Wo - Vr</option>
          <option value="di-do-za">Di - Do - Za</option>
        </select>

        <label>HERHALEN TOT EINDDATUM</label>
        <input type="date" id="eindDatumHerhalingInput">
      </div>

      <button class="btn-action" id="submitBtn" onclick="opslaanRit()">Rit Inplannen</button>
    </div>

  </div>

  <script>
    const BIN_ID = '6ab4ec9dffd5d1605329c8e3';
    const MASTER_KEY = '$2a$10$AAsaI9LebId4BAj60iBn3.V/Y3ayfLpT5qI5vhouztfHHUpgmuQdG';

    let appData = { 
      ritten: [], 
      bestemmingen: ["Ziekenhuis", "Therapie", "Centrum"], 
      bedrijven: ["Taxicentrale A", "Zorgvervoer B", "Regiotaxi"] 
    };

    let editingIndex = null;

    function renderDate() {
      const options = { weekday: 'long', month: 'short', day: 'numeric' };
      document.getElementById('currentDateStr').innerText = new Date().toLocaleDateString('nl-NL', options);
    }

    function setStatus(type, text) {
      let indicator = document.getElementById('syncStatusIndicator');
      let textEl = document.getElementById('syncText');
      textEl.innerText = text;
      indicator.className = "sync-status " + type;
    }

    function initUI() {
      renderDate();

      let bSelect = document.getElementById('bestemmingSelect');
      let currentB = bSelect.value;
      bSelect.innerHTML = "";
      appData.bestemmingen.forEach(b => {
        let opt = document.createElement('option');
        opt.value = b;
        opt.innerText = b;
        bSelect.appendChild(opt);
      });
      if(currentB && appData.bestemmingen.includes(currentB)) bSelect.value = currentB;

      let cSelect = document.getElementById('bedrijfSelect');
      let currentC = cSelect.value;
      cSelect.innerHTML = "";
      appData.bedrijven.forEach(c => {
        let opt = document.createElement('option');
        opt.value = c;
        opt.innerText = c;
        cSelect.appendChild(opt);
      });
      if(currentC && appData.bedrijven.includes(currentC)) cSelect.value = currentC;
    }

    function updateUI() {
      initUI();
      let receiptContainer = document.getElementById('receiptList');
      let badge = document.getElementById('aantalRittenBadge');
      
      if (appData.ritten && appData.ritten.length > 0) {
        badge.innerText = appData.ritten.length;
        receiptContainer.innerHTML = "";

        let sortedRitten = [...appData.ritten].sort((a, b) => {
          if (a.afgehandeld !== b.afgehandeld) return a.afgehandeld ? 1 : -1;
          return new Date(a.afspraak) - new Date(b.afspraak);
        });

        sortedRitten.forEach((item) => {
          let origIndex = appData.ritten.indexOf(item);
          let row = document.createElement('div');
          row.className = "receipt-item";
          if(item.afgehandeld) row.style.opacity = "0.4";

          let afspraakFormatted = item.afspraak ? item.afspraak.replace('T', ' ') : '';
          
          row.innerHTML = `
            <div>
              <div style="font-weight: 700; color: #f8fafc; font-size: 12px;">${afspraakFormatted}</div>
              <div>
                <span class="tag tag-dest">${item.bestemming}</span>
                <span class="tag tag-comp">${item.bedrijf}</span>
              </div>
            </div>
            <div class="action-btns">
              <button class="btn-edit" onclick="laadRitVoorBewerking(${origIndex})">Bewerk</button>
              <button class="btn-check" onclick="toggleAfgehandeld(${origIndex})">${item.afgehandeld ? 'Heropen' : '✓'}</button>
              <button class="item-del-btn" onclick="deleteRit(${origIndex})">✕</button>
            </div>
          `;
          receiptContainer.appendChild(row);
        });
      } else {
        badge.innerText = "0";
        receiptContainer.innerHTML = `<div style="color: #64748b; text-align: center; font-size: 11px; padding: 15px;">Geen ritten ingepland</div>`;
      }
    }

    function slaOpInBin() {
      setStatus("syncing", "Opslaan...");

      fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': MASTER_KEY
        },
        body: JSON.stringify(appData)
      })
      .then(res => res.json())
      .then(data => {
        setStatus("synced", "Opgeslagen");
        setTimeout(() => setStatus("synced", "Verbonden"), 2000);
      })
      .catch(err => {
        console.error("Fout bij opslaan in bin:", err);
        setStatus("error", "Fout bij opslaan");
      });
    }

    function laadVanBin(isManual = false) {
      if(isManual) setStatus("syncing", "Laden...");

      fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: {
          'X-Master-Key': MASTER_KEY
        }
      })
      .then(res => res.json())
      .then(data => {
        if (data && data.record) {
          appData = data.record;
          updateUI();
          if(isManual) {
            setStatus("synced", "Bijgewerkt");
            setTimeout(() => setStatus("synced", "Verbonden"), 2000);
          }
        }
      })
      .catch(err => {
        console.error("Fout bij laden van bin:", err);
        if(isManual) setStatus("error", "Laadfout");
      });
    }

    function addBestemming() {
      let val = document.getElementById('newBestemmingInput').value.trim();
      if(val && !appData.bestemmingen.includes(val)) {
        appData.bestemmingen.push(val);
        document.getElementById('newBestemmingInput').value = "";
        updateUI();
        slaOpInBin();
      }
    }

    function addBedrijf() {
      let val = document.getElementById('newBedrijfInput').value.trim();
      if(val && !appData.bedrijven.includes(val)) {
        appData.bedrijven.push(val);
        document.getElementById('newBedrijfInput').value = "";
        updateUI();
        slaOpInBin();
      }
    }

    function setLiveTime(target) {
      let now = new Date();
      let year = now.getFullYear();
      let month = String(now.getMonth() + 1).padStart(2, '0');
      let day = String(now.getDate()).padStart(2, '0');
      let hours = String(now.getHours()).padStart(2, '0');
      let minutes = String(now.getMinutes()).padStart(2, '0');
      let localString = `${year}-${month}-${day}T${hours}:${minutes}`;

      if(target === 'start') {
        document.getElementById('startInput').value = localString;
      } else {
        document.getElementById('eindInput').value = localString;
        
        // AUTOMATISCH VINKJE: Als we op Stop Nu drukken, vullen we ook direct de afspraak of control in
        // en als we in bewerkmodus zitten, zetten we hem meteen op afgehandeld!
        if (editingIndex !== null) {
          appData.ritten[editingIndex].afgehandeld = true;
        }
      }
    }

    function laadRitVoorBewerking(index) {
      let rit = appData.ritten[index];
      document.getElementById('afspraakInput').value = rit.afspraak || '';
      document.getElementById('startInput').value = rit.start || '';
      document.getElementById('eindInput').value = rit.eind || '';
      document.getElementById('bestemmingSelect').value = rit.bestemming || '';
      document.getElementById('bedrijfSelect').value = rit.bedrijf || '';
      
      editingIndex = index;
      document.getElementById('formTitle').innerText = "Rit Bewerken";
      document.getElementById('submitBtn').innerText = "Wijziging Opslaan";
      document.getElementById('submitBtn').classList.add('editing');
      document.getElementById('inputFormCard').classList.add('active-edit');
      document.getElementById('herhalingContainer').style.display = 'none';
      
      window.scrollTo({ top: document.getElementById('inputFormCard').offsetTop, behavior: 'smooth' });
    }

    function opslaanRit() {
      let afspraak = document.getElementById('afspraakInput').value;
      if(!afspraak) {
        alert("Afspraak datum en tijd is verplicht!");
        return;
      }

      let start = document.getElementById('startInput').value;
      let eind = document.getElementById('eindInput').value;
      let bestemming = document.getElementById('bestemmingSelect').value;
      let bedrijf = document.getElementById('bedrijfSelect').value;
      let herhaling = document.getElementById('herhalingSelect').value;
      let eindHerhaling = document.getElementById('eindDatumHerhalingInput').value;

      // Als de eindtijd is ingevuld (bijv. via Stop Nu), zetten we hem automatisch op afgehandeld (true)
      let isAfgehandeldAuto = eind !== "";

      if (editingIndex !== null) {
        appData.ritten[editingIndex] = {
          ...appData.ritten[editingIndex],
          afspraak, start, eind, bestemming, bedrijf,
          afgehandeld: isAfgehandeldAuto ? true : appData.ritten[editingIndex].afgehandeld
        };
        editingIndex = null;
        document.getElementById('formTitle').innerText = "Nieuwe Rit Inplannen";
        document.getElementById('submitBtn').innerText = "Rit Inplannen";
        document.getElementById('submitBtn').classList.remove('editing');
        document.getElementById('inputFormCard').classList.remove('active-edit');
        document.getElementById('herhalingContainer').style.display = 'block';
      } else {
        appData.ritten.push({
          afspraak, start, eind, bestemming, bedrijf, afgehandeld: isAfgehandeldAuto
        });

        if(herhaling !== 'geen' && eindHerhaling) {
          let baseDate = new Date(afspraak);
          let endDate = new Date(eindHerhaling + "T23:59:59");
          let currDate = new Date(baseDate);

          while(true) {
            if(herhaling === 'dag') currDate.setDate(currDate.getDate() + 1);
            else if(herhaling === 'omdedag') currDate.setDate(currDate.getDate() + 2);
            else if(herhaling === 'ma-wo-vr') {
              do { currDate.setDate(currDate.getDate() + 1); } 
              while([2, 4, 0].includes(currDate.getDay()));
            }
            else if(herhaling === 'di-do-za') {
              do { currDate.setDate(currDate.getDate() + 1); } 
              while([1, 3, 5, 0].includes(currDate.getDay()));
            }

            if(currDate > endDate) break;

            let y = currDate.getFullYear();
            let m = String(currDate.getMonth() + 1).padStart(2, '0');
            let d = String(currDate.getDate()).padStart(2, '0');
            let hr = String(baseDate.getHours()).padStart(2, '0');
            let min = String(baseDate.getMinutes()).padStart(2, '0');
            let isoStr = `${y}-${m}-${d}T${hr}:${min}`;

            appData.ritten.push({
              afspraak: isoStr,
              start: start ? `${y}-${m}-${d}T` + start.split('T')[1] : '',
              eind: eind ? `${y}-${m}-${d}T` + eind.split('T')[1] : '',
              bestemming,
              bedrijf,
              afgehandeld: false
            });
          }
        }
      }

      document.getElementById('afspraakInput').value = "";
      document.getElementById('startInput').value = "";
      document.getElementById('eindInput').value = "";
      
      updateUI();
      slaOpInBin();
    }

    function toggleAfgehandeld(index) {
      appData.ritten[index].afgehandeld = !appData.ritten[index].afgehandeld;
      updateUI();
      slaOpInBin();
    }

    function deleteRit(index) {
      if(confirm("Weet je zeker dat je deze rit wilt verwijderen?")) {
        appData.ritten.splice(index, 1);
        updateUI();
        slaOpInBin();
      }
    }

    laadVanBin(false);
  </script>
</body>
</html>
