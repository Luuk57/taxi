  <style>

      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 6px;
    }
    .btn-main:hover { background: var(--primary-hover); }
    .btn-main:active { transform: scale(0.98); }

    /* RITTEN LIJST */
    .trips-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 400px;
      overflow-y: auto;

    .trip-card {
      background: #0f172a;
      border: 1px solid var(--card-border);

      align-items: center;

    }
    .trip-card.done { opacity: 0.5; }

    .trip-info { display: flex; flex-direction: column; gap: 4px; }
    .trip-time { font-size: 13px; font-weight: 700; color: #fff; }
    .trip-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
    
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .badge-dest { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-comp { background: rgba(168, 85, 247, 0.15); color: #a855f7; border: 1px solid rgba(168, 85, 247, 0.3); }

    .trip-actions { display: flex; gap: 6px; align-items: center; }
    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;

      height: 28px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.2); }
    .icon-btn.done-btn { color: var(--accent-green); }
    .icon-btn.edit-btn { color: var(--accent-amber); }
    .icon-btn.del-btn { color: var(--accent-rose); }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      padding: 30px 0;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e293b;
      color: #fff;
      border: 1px solid var(--card-border);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- HEADER -->
    <header class="app-header">
      <div class="app-title">
        <h1>DriveSync</h1>
        <p id="dateDisplay">Laden...</p>
      </div>
      <div class="sync-status" onclick="syncData(true)" title="Klik om te verversen">
        <div class="sync-dot" id="syncDot"></div>
        <span id="syncText">Verbinden</span>
      </div>
    </header>

    <!-- RITTEN LIJST OVERZICHT -->
    <section class="card">
      <div class="card-header">
        <span>Actieve Ritten</span>
        <span id="tripCount" style="font-size: 11px; background: rgba(255,255,255,0.08); padding: 2px 8px; border-radius: 10px;">0</span>
      </div>
      <div class="trips-list" id="tripsList">
        <div class="empty-state">Geen ritten gevonden</div>
      </div>
    </section>

    <!-- FORMULIER VOOR INVOER / BEWERKEN -->
    <section class="card" id="formCard">
      <div class="card-header" id="formTitle">Nieuwe Rit Inplannen</div>

      <div class="form-group">
        <label>Afspraak Tijdstip *</label>
        <input type="datetime-local" id="afspraakInput">
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Start Tijd</label>
          <input type="datetime-local" id="startInput">
        </div>
        <div class="form-group">
          <label>Eind Tijd</label>
          <input type="datetime-local" id="eindInput">
        </div>
      </div>

      <div class="timer-buttons">
        <button class="btn-timer" onclick="setNow('start')">▶ Start Nu</button>
        <button class="btn-timer stop" onclick="setNow('eind')">⏹ Stop Nu</button>
      </div>

      <div class="form-group">
        <label>Bestemming</label>
        <select id="bestemmingSelect"></select>
        <div class="action-row" style="margin-top: 6px;">
          <input type="text" id="newBestemming" placeholder="Nieuwe bestemming...">
          <button class="btn-sub" onclick="addItem('bestemming')">Toevoegen</button>
        </div>
      </div>

      <div class="form-group">
        <label>Taxibedrijf</label>
        <select id="bedrijfSelect"></select>
        <div class="action-row" style="margin-top: 6px;">
          <input type="text" id="newBedrijf" placeholder="Nieuw bedrijf...">
          <button class="btn-sub" onclick="addItem('bedrijf')">Toevoegen</button>
        </div>
      </div>

      <div id="herhalingWrapper">
        <div class="form-group">
          <label>Herhaling</label>
          <select id="herhalingSelect">
            <option value="geen">Geen herhaling</option>
            <option value="dag">Elke dag</option>
            <option value="omdedag">Om de dag</option>
            <option value="ma-wo-vr">Ma - Wo - Vr</option>
            <option value="di-do-za">Di - Do - Za</option>
          </select>
        </div>
        <div class="form-group">
          <label>Herhalen tot einddatum</label>
          <input type="date" id="eindHerhalingInput">
        </div>
      </div>

      <button class="btn-main" id="submitBtn" onclick="saveTrip()">Rit Opslaan</button>
    </section>

  </div>

  <div class="toast" id="toastMsg">Melding</div>

  <script>
    const BIN_ID = '6ab4ec9dff5d1605329c8e3';
    const MASTER_KEY = '$2a$10$z00i0.yQGLewzeMwUAoiiOSlRVYrxxBvyL/8Q0SGpLP8YiVTTuTF2';
    
    let appData = {
      ritten: [],
      bestemmingen: ["Ziekenhuis", "Therapie", "Centrum"],
      bedrijven: ["Taxicentrale A", "Zorgvervoer B", "Regiotaxi"]
    };

    let editingIndex = null;
    let isSaving = false;

    function updateHeaderDate() {
      const options = { weekday: 'long', day: 'numeric', month: 'short' };
      document.getElementById('dateDisplay').innerText = new Date().toLocaleDateString('nl-NL', options);
    }

    function initDropdowns() {
      const bSelect = document.getElementById('bestemmingSelect');
      const currentB = bSelect.value;
      bSelect.innerHTML = "";
      appData.bestemmingen.forEach(item => {
        let opt = document.createElement('option');
        opt.value = item; opt.innerText = item;
        bSelect.appendChild(opt);
      });
      if (currentB && appData.bestemmingen.includes(currentB)) bSelect.value = currentB;

      const cSelect = document.getElementById('bedrijfSelect');
      const currentC = cSelect.value;
      cSelect.innerHTML = "";
      appData.bedrijven.forEach(item => {
        let opt = document.createElement('option');
        opt.value = item; opt.innerText = item;
        cSelect.appendChild(opt);
      });
      if (currentC && appData.bedrijven.includes(currentC)) cSelect.value = currentC;
    }

    function setNow(target) {
      const now = new Date();
      const local = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
      document.getElementById(target + 'Input').value = local;
    }

    function addItem(type) {
      const inputId = type === 'bestemming' ? 'newBestemming' : 'newBedrijf';
      const val = document.getElementById(inputId).value.trim();
      const listKey = type === 'bestemming' ? 'bestemmingen' : 'bedrijven';

      if (val && !appData[listKey].includes(val)) {
        appData[listKey].push(val);
        document.getElementById(inputId).value = "";
        initDropdowns();
        document.getElementById(type === 'bestemming' ? 'bestemmingSelect' : 'bedrijfSelect').value = val;
        syncData(false, type === 'bestemming' ? 'Bestemming toegevoegd' : 'Bedrijf toegevoegd');
      }
    }

    function renderTrips() {
      const container = document.getElementById('tripsList');
      document.getElementById('tripCount').innerText = appData.ritten.length;

      if (!appData.ritten || appData.ritten.length === 0) {
        container.innerHTML = `<div class="empty-state">Geen ritten gepland</div>`;
        return;
      }

      let sorted = [...appData.ritten].map((item, idx) => ({ ...item, originalIndex: idx })).sort((a, b) => {
        if (a.afgehandeld !== b.afgehandeld) return a.afgehandeld ? 1 : -1;
        return new Date(a.afspraak) - new Date(b.afspraak);
      });

      container.innerHTML = "";
      sorted.forEach(trip => {
        let card = document.createElement('div');
        card.className = `trip-card ${trip.afgehandeld ? 'done' : ''}`;
        
        let formattedDate = trip.afspraak ? trip.afspraak.replace('T', ' ') : '';
        
        card.innerHTML = `
          <div class="trip-info">
            <div class="trip-time">${formattedDate}</div>
            <div class="trip-meta">
              <span class="badge badge-dest">${trip.bestemming}</span>
              <span class="badge badge-comp">${trip.bedrijf}</span>
            </div>
          </div>
          <div class="trip-actions">
            <button class="icon-btn edit-btn" onclick="startEdit(${trip.originalIndex})" title="Bewerk">✎</button>
            <button class="icon-btn done-btn" onclick="toggleDone(${trip.originalIndex})" title="Status">${trip.afgehandeld ? '↺' : '✓'}</button>
            <button class="icon-btn del-btn" onclick="deleteTrip(${trip.originalIndex})" title="Verwijder">✕</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function saveTrip() {
      const afspraak = document.getElementById('afspraakInput').value;
      if (!afspraak) {
        showToast("Kies ten minste een afspraak tijdstip!");
        return;
      }

      const start = document.getElementById('startInput').value;
      const eind = document.getElementById('eindInput').value;
      const bestemming = document.getElementById('bestemmingSelect').value;
      const bedrijf = document.getElementById('bedrijfSelect').value;
      const herhaling = document.getElementById('herhalingSelect').value;
      const eindHerhaling = document.getElementById('eindHerhalingInput').value;

      if (editingIndex !== null) {
        appData.ritten[editingIndex] = { ...appData.ritten[editingIndex], afspraak, start, eind, bestemming, bedrijf };
        resetForm();
        syncData(false, "Rit bijgewerkt! ✅");
      } else {
        appData.ritten.push({ afspraak, start, eind, bestemming, bedrijf, afgehandeld: false });

        if (herhaling !== 'geen' && eindHerhaling) {
          let baseDate = new Date(afspraak);
          let endDate = new Date(eindHerhaling + "T23:59:59");
          let curr = new Date(baseDate);

          while (true) {
            if (herhaling === 'dag') curr.setDate(curr.getDate() + 1);
            else if (herhaling === 'omdedag') curr.setDate(curr.getDate() + 2);
            else if (herhaling === 'ma-wo-vr') {
              do { curr.setDate(curr.getDate() + 1); } while ([2, 4, 0].includes(curr.getDay()));
            } else if (herhaling === 'di-do-za') {
              do { curr.setDate(curr.getDate() + 1); } while ([1, 3, 5, 0].includes(curr.getDay()));
            }

            if (curr > endDate) break;

            let y = curr.getFullYear();
            let m = String(curr.getMonth() + 1).padStart(2, '0');
            let d = String(curr.getDate()).padStart(2, '0');
            let hr = String(baseDate.getHours()).padStart(2, '0');
            let min = String(baseDate.getMinutes()).padStart(2, '0');

            appData.ritten.push({
              afspraak: `${y}-${m}-${d}T${hr}:${min}`,
              start: start ? `${y}-${m}-${d}T${start.split('T')[1]}` : "",
              eind: eind ? `${y}-${m}-${d}T${eind.split('T')[1]}` : "",
              bestemming, bedrijf, afgehandeld: false
            });
          }
        }

        resetForm();
        syncData(false, "Rit(ten) ingepland! ✅");
      }
    }

    function startEdit(idx) {
      let trip = appData.ritten[idx];
      document.getElementById('afspraakInput').value = trip.afspraak || '';
      document.getElementById('startInput').value = trip.start || '';
      document.getElementById('eindInput').value = trip.eind || '';
      document.getElementById('bestemmingSelect').value = trip.bestemming || '';
      document.getElementById('bedrijfSelect').value = trip.bedrijf || '';

      editingIndex = idx;
      document.getElementById('formTitle').innerText = "Rit Bewerken";
      document.getElementById('submitBtn').innerText = "Wijziging Opslaan";
      document.getElementById('submitBtn').classList.add('editing');
      document.getElementById('herhalingWrapper').style.display = 'none';

      window.scrollTo({ top: document.getElementById('formCard').offsetTop, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('afspraakInput').value = '';
      document.getElementById('startInput').value = '';
      document.getElementById('eindInput').value = '';
      editingIndex = null;
      document.getElementById('formTitle').innerText = "Nieuwe Rit Inplannen";
      document.getElementById('submitBtn').innerText = "Rit Opslaan";
      document.getElementById('submitBtn').classList.remove('editing');
      document.getElementById('herhalingWrapper').style.display = 'block';
    }

    function toggleDone(idx) {
      appData.ritten[idx].afgehandeld = !appData.ritten[idx].afgehandeld;
      syncData(false, "Status gewijzigd");
    }

    function deleteTrip(idx) {
      if (confirm("Weet je zeker dat je deze rit wilt verwijderen?")) {
        appData.ritten.splice(idx, 1);
        syncData(false, "Rit verwijderd 🗑️");
      }
    }

    function setStatus(status, text) {
      const dot = document.getElementById('syncDot');
      const label = document.getElementById('syncText');
      dot.className = "sync-dot " + status;
      label.innerText = text;
    }

    function showToast(msg) {
      const t = document.getElementById('toastMsg');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function syncData(manual = false, successMsg = "Opgeslagen! ✅") {
      if (isSaving) return;
      isSaving = true;
      setStatus('', 'Opslaan...');

      fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': MASTER_KEY
        },
        body: JSON.stringify(appData)
      })
      .then(res => res.json())
      .then(() => {
        isSaving = false;
        setStatus('online', 'Online');
        initDropdowns();
        renderTrips();
        if (manual || successMsg) showToast(successMsg);
      })
      .catch(err => {
        console.error(err);
        isSaving = false;
        setStatus('error', 'Fout');
        showToast("Synchronisatiefout ❌");
      });
    }

    function loadData() {
      setStatus('', 'Laden...');
      fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest?nocache=` + new Date().getTime(), {
        headers: {
          'X-Master-Key': MASTER_KEY,
          'Cache-Control': 'no-cache'
        }
      })
      .then(res => res.json())
      .then(data => {
        if (data && data.record && Array.isArray(data.record.ritten)) {
          appData = data.record;
          setStatus('online', 'Online');
          initDropdowns();
          renderTrips();
        } else {
          setStatus('online', 'Gereed');
        }
      })
      .catch(err => {
        console.error(err);
        setStatus('error', 'Offline');
      });
    }

    updateHeaderDate();
    loadData();
    setInterval(loadData, 5000);
  </script>
</body>
</html>
